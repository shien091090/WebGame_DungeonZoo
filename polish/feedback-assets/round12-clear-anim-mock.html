<title>來馬戲團通關動畫方案</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* 版面: 單欄, 上方方案切換, 中間大播放器(遊戲畫面 16:9), 下方說明; 刻意只做馬戲團夜場的暗色一款 */
:root {
  --bg: #10131c;
  --surface: #1a1f2d;
  --line: #2f374c;
  --fg: #e9edf6;
  --dim: #9aa5bd;
  --gold: #ffd84a;
  --red: #d23a46;
  --font: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1100px; margin: 0 auto; padding-block: 28px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
header { display: grid; gap: 4px; }
.eyebrow { color: var(--gold); font-size: 13px; letter-spacing: .12em; font-weight: 700; }
h1 { margin: 0; font-size: clamp(24px, 4vw, 34px); font-weight: 900; text-wrap: balance; }
header p { margin: 0; color: var(--dim); max-width: 65ch; }
.opts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .opts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.opt { text-align: left; font: inherit; color: var(--fg); background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; display: grid; gap: 2px; min-width: 0; }
.opt b { font-size: 17px; font-weight: 900; }
.opt b span { color: var(--gold); margin-right: 6px; }
.opt small { color: var(--dim); font-size: 13px; line-height: 1.45; }
.opt[aria-pressed="true"] { border-color: var(--gold); background: #262012; }
.opt:focus-visible, .ctl button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.player { display: grid; gap: 8px; }
canvas { display: block; width: 100%; max-width: 100%; height: auto; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; }
.tl { height: 6px; background: var(--surface); border-radius: 3px; overflow: hidden; }
.tl i { display: block; height: 100%; width: 0; background: var(--gold); }
.ctl { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.cap { flex: 1; min-width: 220px; font-weight: 700; }
.ctl button { font: inherit; font-size: 14px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 14px; cursor: pointer; }
.desc { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; }
.desc h2 { margin: 0; font-size: 19px; font-weight: 900; }
.desc ol { margin: 0; padding-left: 1.3em; color: var(--dim); }
.desc ol li { margin: 2px 0; }
.note { color: var(--dim); font-size: 13px; margin: 0; }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">來馬戲團看一點大場面 · 第 4 天之後</div>
    <h1>通關畫面要多盛大? 四種方案</h1>
    <p>每個方案都從第 4 天表演結算開始, 玩家按 Z 後接到通關畫面。評價星數已拿掉, 成績照樣列出。點上面的方案切換, 喜歡哪個回覆代號就好, 也可以混搭(例:「B 的布幕 + C 的金幣雨」)。</p>
  </header>

  <div class="opts" role="group" aria-label="方案">
    <button class="opt" id="opt-A" data-k="A" aria-pressed="true"><b><span>A</span>煙火之夜</b><small>畫面變暗, 滿天煙火在面板四周炸開</small></button>
    <button class="opt" id="opt-B" data-k="B" aria-pressed="false"><b><span>B</span>帳篷大謝幕</b><small>紅布幕拉上再拉開, 燈泡招牌降下, 雙聚光燈掃場</small></button>
    <button class="opt" id="opt-C" data-k="C" aria-pressed="false"><b><span>C</span>黃金爆閃</b><small>白光一閃, 四個字逐字砸下震動, 金幣雨灑滿畫面</small></button>
    <button class="opt" id="opt-D" data-k="D" aria-pressed="false"><b><span>D</span>怪物大遊行</b><small>彩帶砲齊發, 緞帶橫幅展開, 收服的怪物在兩側跳舞</small></button>
  </div>

  <div class="player">
    <canvas id="c" width="1280" height="720" aria-label="通關動畫預覽"></canvas>
    <div class="tl"><i id="tl"></i></div>
    <div class="ctl">
      <div class="cap" id="cap"></div>
      <button id="btn-pause">暫停</button>
      <button id="btn-replay">從頭播</button>
      <button id="btn-slow">慢速 0.5×</button>
    </div>
  </div>

  <section class="desc" aria-live="polite">
    <h2 id="d-title"></h2>
    <ol id="d-steps"></ol>
  </section>
  <p class="note">畫面是用遊戲本身的美術程式畫的, 成績是假資料, 沒有聲音。正式版會在標題出現時配一段慶祝音效, 取代原本每顆星的音效。</p>
</div>

<script src="art.js"></script>
<script>
(function () {
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var PRE = 2.4, BODY = 9.5, DUR = PRE + BODY;
  var t = 0, last = performance.now(), paused = false, speed = 1, cur = 'A';
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var BANK = [{ species: 'monkey', count: 6 }, { species: 'beetle', count: 4 }, { species: 'parrot', count: 3 }, { species: 'hedgehog', count: 2 }, { species: 'lily', count: 2 }, { species: 'penguin', count: 2 }, { species: 'tanuki', count: 1 }];
  var R = { rep: 2840, goldEarned: 1265, bestChain: 9, days: ['d1', 'd1', 'd2', 'd2'], bank: BANK, cards: 8, cardsMax: 13, boosts: 5, boostsMax: 9 };
  var HUD = { phase: 'result', day: 4, dayMax: 4, gold: 310, rep: 2840, sat: 0, message: '[Z] 重來' };
  var COL = ['#ffd84a', '#ff6b8a', '#7ad7ff', '#c6f046', '#ffa94a', '#ffffff', '#c58bff'];
  var FONT = '"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif';

  function c01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function rnd(i, k) { var x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); }
  function out3(v) { v = c01(v); return 1 - Math.pow(1 - v, 3); }
  function backOut(v) { v = c01(v); var c = 1.9; return 1 + (c + 1) * Math.pow(v - 1, 3) + c * Math.pow(v - 1, 2); }
  // 面板座標 → 畫面座標(總結算面板以 (640,390) 放大 1.15 倍)
  function scr(x, y) { return [640 + x * 1.15, 390 + y * 1.15]; }

  // ── 共用: 第 4 天表演結算 ──
  function showPhase(tt) {
    Art.drawBackground(ctx, { scene: 'sresult', day: 4, prepStage: '' });
    Art.drawShowResult(ctx, { sat: 1520, gold: 380, fameGain: 1520, tallyT: Math.min(tt, 1.3), tallyDur: 1.3, bestChain: 9, loose: false, timeLeft: 0, tutorial: false });
    Art.drawHud(ctx, { phase: 'sresult', day: 4, dayMax: 4, gold: 310, rep: 1320 + Math.floor(1520 * c01(tt / 1.3)), sat: 0, message: '[Z] 繼續' });
    if (tt > PRE - 0.7) {
      var a = Math.sin(Math.PI * c01((tt - (PRE - 0.7)) / 0.7));
      ctx.save(); ctx.globalAlpha = a; ctx.font = 'bold 30px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 6; ctx.strokeStyle = '#000'; ctx.strokeText('▼ 玩家按下 Z', 640, 140); ctx.fillStyle = '#ffd84a'; ctx.fillText('▼ 玩家按下 Z', 640, 140); ctx.restore();
    }
  }
  function resultPanel(et, o) {
    Art.drawBackground(ctx, { scene: 'result', day: 4, prepStage: '' });
    ctx.save();
    if (o.enter) o.enter(ctx);
    Art.drawResultPanel(ctx, Object.assign({ header: o.header, fx: o.fx, hideZ: et < 2.2 }, R));
    ctx.restore();
    Art.drawHud(ctx, HUD);
  }
  function title(ctx, T, P, txt, sc, glow, y, size) {
    if (sc <= 0) return;
    ctx.save(); ctx.translate(0, y == null ? -228 : y); ctx.scale(sc, sc);
    ctx.shadowColor = 'rgba(255,216,74,' + glow.toFixed(2) + ')'; ctx.shadowBlur = 26;
    T(ctx, txt, 0, 0, { size: size || 56, color: P.select, noMin: true });
    ctx.restore();
  }
  function subtitle(ctx, T, P, a) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; T(ctx, '4 天的表演全部演完了!', 0, -178, { size: 19, color: P.textDim }); ctx.restore(); }
  // 紙花: 指數阻力 + 終端速度, 封閉解(可任意跳時間)
  function confetti(ctx, tt, n, seed, ox, oy, ang, spread, spMin, spMax, life) {
    if (tt <= 0) return;
    var k = 3.2, vt = 120;
    for (var i = 0; i < n; i++) {
      var a = ang + (rnd(i, seed) - 0.5) * spread, sp = spMin + rnd(i, seed + 1) * (spMax - spMin);
      var vx = Math.cos(a) * sp, vy = Math.sin(a) * sp, e = (1 - Math.exp(-k * tt)) / k;
      var x = ox + vx * e + Math.sin(tt * (2 + rnd(i, seed + 2) * 3) + i) * 16 * c01(tt);
      var y = oy + (vy - vt) * e + vt * tt;
      var fade = life ? c01((life - tt) / 1.2) : 1;
      if (fade <= 0 || y > 760) continue;
      ctx.save(); ctx.globalAlpha *= fade; ctx.translate(x, y); ctx.rotate(tt * (3 + rnd(i, seed + 3) * 8) + i);
      ctx.scale(1, Math.abs(Math.cos(tt * (4 + rnd(i, seed + 4) * 6) + i)) * 0.85 + 0.15);
      ctx.fillStyle = COL[i % COL.length]; ctx.fillRect(-7, -3.5, 14, 7); ctx.restore();
    }
  }
  function star4(ctx, x, y, r, a) {
    if (a <= 0) return;
    ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.beginPath();
    for (var i = 0; i < 8; i++) { var rr = i % 2 ? r * 0.22 : r, an = i * Math.PI / 4; ctx.lineTo(Math.cos(an) * rr, Math.sin(an) * rr); }
    ctx.closePath(); ctx.fillStyle = '#fff6c8'; ctx.shadowColor = '#ffd84a'; ctx.shadowBlur = 12; ctx.fill(); ctx.restore();
  }

  // ── A 煙火之夜 ──
  function fireworks(et) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (var r = 0; r < 20; r++) {
      var t0 = 0.15 + r * 0.33 + rnd(r, 9) * 0.2, lt = et - t0;
      if (lt < 0 || lt > 2.6) continue;
      var left = r % 3 === 0, right = r % 3 === 1;
      var bx = left ? 70 + rnd(r, 1) * 170 : right ? 1040 + rnd(r, 1) * 170 : 300 + rnd(r, 1) * 680;
      var by = left || right ? 120 + rnd(r, 2) * 380 : 50 + rnd(r, 2) * 90;
      var col = COL[r % 6], rise = 0.55;
      if (lt < rise) {   // 升空的火箭
        var p = out3(lt / rise), y = 760 + (by - 760) * p;
        ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.globalAlpha = 0.9; ctx.beginPath(); ctx.moveTo(bx, y + 40); ctx.lineTo(bx, y); ctx.stroke();
        continue;
      }
      var bt = lt - rise, fade = c01(1 - bt / 2.1), sp = 330 + rnd(r, 3) * 170, k = 2.4;
      if (bt < 0.12) { ctx.globalAlpha = 1 - bt / 0.12; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(bx, by, 60 * (1 - bt / 0.12) + 10, 0, 6.283); ctx.fill(); }
      for (var i = 0; i < 64; i++) {
        var a = i / 64 * 6.283 + rnd(r, 4), s2 = sp * (0.75 + rnd(i, r) * 0.35);
        var d = s2 * (1 - Math.exp(-k * bt)) / k, d0 = s2 * (1 - Math.exp(-k * Math.max(0, bt - 0.09))) / k;
        var g = 60 * bt * bt;
        var x = bx + Math.cos(a) * d, y = by + Math.sin(a) * d + g, x0 = bx + Math.cos(a) * d0, y0 = by + Math.sin(a) * d0 + 60 * Math.pow(Math.max(0, bt - 0.09), 2);
        var tw = bt > 1.0 ? (Math.sin(bt * 30 + i) > 0 ? 1 : 0.3) : 1;
        ctx.globalAlpha = fade * tw; ctx.strokeStyle = i % 4 ? col : '#ffffff'; ctx.lineWidth = 3.5; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x, y); ctx.stroke();
      }
    }
    ctx.restore();
  }
  var A = {
    name: 'A 煙火之夜',
    steps: ['按 Z 後畫面先暗下來, 通關面板從中間放大浮現', '「恭喜過關」大字彈出, 同時一圈金色衝擊波擴散', '連續十幾發煙火從底部升空, 在面板四周與上方炸開', '兩側噴出紙花, 飄落整個畫面', '約 7 秒後煙火停止, 留下發光的標題與成績'],
    draw: function (et) {
      resultPanel(et, {
        enter: function (c) { var s = 0.9 + 0.1 * out3(et / 0.4); c.globalAlpha = c01(et / 0.3); c.translate(640, 390); c.scale(s, s); c.translate(-640, -390); },
        header: function (c, T, P) {
          var pt = c01((et - 0.3) / 0.45);
          title(c, T, P, '恭喜過關', pt <= 0 ? 0 : backOut(pt), 0.6 + 0.3 * Math.sin(et * 3));
          subtitle(c, T, P, c01((et - 0.8) / 0.3));
          var wt = et - 0.4;   // 衝擊波
          if (wt > 0 && wt < 0.8) { c.save(); c.globalAlpha = 1 - wt / 0.8; c.strokeStyle = '#ffd84a'; c.lineWidth = 6 * (1 - wt / 0.8) + 1; c.beginPath(); c.ellipse(0, -228, 60 + wt * 520, 20 + wt * 170, 0, 0, 6.283); c.stroke(); c.restore(); }
        }
      });
      if (et < 0.35) { ctx.fillStyle = 'rgba(0,0,0,' + (0.7 * (1 - et / 0.35)).toFixed(2) + ')'; ctx.fillRect(0, 0, 1280, 720); }
      fireworks(et);
      confetti(ctx, et - 0.4, 60, 11, 470, 128, -1.9, 1.1, 300, 700, 6.5);
      confetti(ctx, et - 0.4, 60, 23, 810, 128, -1.25, 1.1, 300, 700, 6.5);
    }
  };

  // ── B 帳篷大謝幕 ──
  function curtain(amt) {
    if (amt <= 0) return;
    var w = 660 * amt;
    for (var side = 0; side < 2; side++) {
      ctx.save();
      if (side) { ctx.translate(1280, 0); ctx.scale(-1, 1); }
      var g = ctx.createLinearGradient(0, 0, w, 0);
      for (var f = 0; f <= 10; f++) { g.addColorStop(f / 10, f % 2 ? '#8e1622' : '#c82a38'); }
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(w, 0);
      ctx.quadraticCurveTo(w - 30 * (1 - amt) - 10, 400, w + 10, 720); ctx.lineTo(0, 720); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#e8b33a'; ctx.fillRect(0, 700, w + 10, 20);   // 金色流蘇
      for (var x = 6; x < w; x += 14) { ctx.fillRect(x, 718, 4, 2); }
      ctx.restore();
    }
    ctx.fillStyle = '#7a1019'; ctx.fillRect(0, 0, 1280, 46);   // 上方垂幔
    ctx.fillStyle = '#e8b33a'; ctx.fillRect(0, 44, 1280, 6);
    for (var i = 0; i < 20; i++) { ctx.fillStyle = '#9c1a26'; ctx.beginPath(); ctx.arc(32 + i * 64, 50, 32, 0, Math.PI); ctx.fill(); }
  }
  function marquee(cx, cy, sc, et) {
    var w = 560, h = 132;
    ctx.save(); ctx.translate(cx, cy); ctx.scale(sc, sc);
    ctx.strokeStyle = '#c99a2e'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-180, -h / 2); ctx.lineTo(-120, -h / 2 - 400); ctx.moveTo(180, -h / 2); ctx.lineTo(120, -h / 2 - 400); ctx.stroke();
    ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 24;
    ctx.fillStyle = '#7a1019'; roundRect(-w / 2, -h / 2, w, h, 22); ctx.fill(); ctx.shadowBlur = 0;
    ctx.strokeStyle = '#ffd84a'; ctx.lineWidth = 6; roundRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16); ctx.stroke();
    var per = [], step = 28;
    for (var x = -w / 2 + 22; x <= w / 2 - 22; x += step) { per.push([x, -h / 2 + 8]); }
    for (var y = -h / 2 + 8 + step; y <= h / 2 - 8 - 4; y += step) { per.push([w / 2 - 8, y]); }
    for (x = w / 2 - 22; x >= -w / 2 + 22; x -= step) { per.push([x, h / 2 - 8]); }
    for (y = h / 2 - 8 - step; y >= -h / 2 + 8 + 4; y -= step) { per.push([-w / 2 + 8, y]); }
    var chase = Math.floor(et * 12);
    per.forEach(function (p, i) {
      var on = (i + chase) % 3 === 0;
      ctx.beginPath(); ctx.arc(p[0], p[1], 6, 0, 6.283); ctx.fillStyle = on ? '#fff6c8' : '#8a6a20';
      if (on) { ctx.shadowColor = '#ffd84a'; ctx.shadowBlur = 14; } ctx.fill(); ctx.shadowBlur = 0;
    });
    ctx.font = '900 60px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 8; ctx.strokeStyle = '#3a0509'; ctx.strokeText('恭喜過關', 0, 2);
    ctx.shadowColor = 'rgba(255,216,74,.8)'; ctx.shadowBlur = 18; ctx.fillStyle = '#ffd84a'; ctx.fillText('恭喜過關', 0, 2);
    ctx.restore();
  }
  function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function spotlights(et) {
    if (et <= 0) return;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    [[120, -40, 1], [1160, -40, -1]].forEach(function (s, i) {
      var sw = Math.sin(et * 1.4 + i * 1.7) * 0.42 * s[2] + 0.5 * s[2] * (1 - c01(et / 1.2));
      var a = Math.PI / 2 - s[2] * 0.62 + sw, len = 900, half = 0.13;
      var g = ctx.createRadialGradient(s[0], s[1], 10, s[0], s[1], len);
      g.addColorStop(0, 'rgba(255,240,190,.38)'); g.addColorStop(1, 'rgba(255,240,190,0)');
      ctx.fillStyle = g; ctx.globalAlpha = c01(et / 0.5);
      ctx.beginPath(); ctx.moveTo(s[0], s[1]); ctx.lineTo(s[0] + Math.cos(a - half) * len, s[1] + Math.sin(a - half) * len); ctx.lineTo(s[0] + Math.cos(a + half) * len, s[1] + Math.sin(a + half) * len); ctx.closePath(); ctx.fill();
    });
    ctx.restore();
  }
  var B = {
    name: 'B 帳篷大謝幕',
    steps: ['按 Z 後紅色布幕從兩側拉上, 蓋住表演結算', '布幕拉上時, 掛滿燈泡的「恭喜過關」招牌從上方吊下來, 晃一晃停住', '布幕往兩側拉開, 露出通關面板, 招牌停在面板頂端當標題', '兩盞聚光燈從上方兩角來回掃場, 燈泡跑馬燈一直閃', '紙花從招牌兩側噴出飄落'],
    draw: function (et) {
      var close = c01(et / 0.55), open = c01((et - 1.35) / 0.7), amt = et < 1.35 ? out3(close) : 1 - out3(open);
      if (et < 0.55) showPhase(PRE); else resultPanel(et - 1.35, { header: function (c, T, P) { subtitle(c, T, P, c01((et - 2.0) / 0.3)); } });
      spotlights(et - 1.6);
      if (et > 1.6) { confetti(ctx, et - 1.6, 50, 31, 380, 128, -2.0, 1.0, 300, 650, 6); confetti(ctx, et - 1.6, 50, 37, 900, 128, -1.15, 1.0, 300, 650, 6); }
      curtain(amt);
      var dt = et - 0.45;   // 招牌: 吊下來、晃動, 最後停在面板頂(畫面 y 128)
      if (dt > 0) {
        var drop = backOut(dt / 0.6), cy = -120 + (300 + 120) * drop;
        if (et > 1.35) cy = 300 + (116 - 300) * out3((et - 1.35) / 0.7);
        var sc = et > 1.35 ? 1 - 0.25 * out3((et - 1.35) / 0.7) : 1;
        var sway = Math.sin(dt * 7) * 0.05 * Math.exp(-dt * 1.5);
        ctx.save(); ctx.translate(640, cy - 400); ctx.rotate(sway); ctx.translate(-640, -(cy - 400)); marquee(640, cy, sc, et); ctx.restore();
      }
    }
  };

  // ── C 黃金爆閃 ──
  function coins(et) {
    if (et <= 0) return;
    for (var i = 0; i < 70; i++) {
      var t0 = rnd(i, 51) * 2.2, lt = et - t0;
      if (lt < 0) continue;
      var x = 30 + rnd(i, 52) * 1220, vy = 260 + rnd(i, 53) * 220, y = -40 + vy * lt + 120 * lt * lt;
      if (y > 760) continue;
      var r = 11 + rnd(i, 54) * 6, sx = Math.cos(lt * (5 + rnd(i, 55) * 5) + i);
      ctx.save(); ctx.translate(x + Math.sin(lt * 2 + i) * 10, y); ctx.scale(Math.abs(sx) * 0.9 + 0.1, 1);
      ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.fillStyle = sx > 0 ? '#ffcc33' : '#e0a21c'; ctx.fill();
      ctx.lineWidth = 2.5; ctx.strokeStyle = '#a8740e'; ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, r * 0.55, 0, 6.283); ctx.strokeStyle = '#fff0a0'; ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();
    }
  }
  var C = {
    name: 'C 黃金爆閃',
    steps: ['按 Z 後整個畫面白光一閃, 通關面板出現', '標題後方亮起一圈旋轉的金色光芒', '「恭」「喜」「過」「關」四個字依序從大砸下, 每砸一個字畫面震一下', '金幣從畫面上方嘩啦啦灑下, 標題四周閃星光', '金幣雨約 4 秒後停, 光芒持續慢慢轉'],
    draw: function (et) {
      var shake = 0;
      for (var i = 0; i < 4; i++) { var it = et - (0.35 + i * 0.2) - 0.14; if (it > 0 && it < 0.18) shake = Math.max(shake, (1 - it / 0.18) * (6 + i * 3)); }

        header: function (c, T, P) {

              c.fillStyle = g; c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, 280 * ra, k * 0.349 - 0.07, k * 0.349 + 0.07); c.closePath(); c.fill();
            }
            c.restore();

          var ch = ['恭', '喜', '過', '關'];
          for (var j = 0; j < 4; j++) {
            var lt = et - (0.35 + j * 0.2); if (lt <= 0) continue;
            var p = c01(lt / 0.14), sc = 3 - 2 * (p * p), al = c01(lt / 0.08);
            c.save(); c.globalAlpha *= al; c.translate((j - 1.5) * 64, -228); c.scale(sc, sc);
            c.shadowColor = 'rgba(255,216,74,.9)'; c.shadowBlur = 24; T(c, ch[j], 0, 0, { size: 58, color: P.select, noMin: true }); c.restore();
          }
          subtitle(c, T, P, c01((et - 1.3) / 0.3));
          for (var s = 0; s < 10; s++) {
            var st = et - 1.2 - s * 0.27; if (st < 0) continue;

            star4(c, (rnd(s, 61) - 0.5) * 520, -228 + (rnd(s, 62) - 0.5) * 120, 9 + rnd(s, 63) * 9, Math.sin(Math.PI * ph));
          }
        }
      });
      coins(et - 0.9);
      ctx.restore();
      if (et < 0.5) { ctx.fillStyle = 'rgba(255,250,230,' + (1 - et / 0.5).toFixed(2) + ')'; ctx.fillRect(0, 0, 1280, 720); }
    }
  };

  // ── D 怪物大遊行 ──
  function ribbon(cx, cy, w, et) {
    if (w <= 4) return;
    var h = 84;
    ctx.save(); ctx.translate(cx, cy);
    [-1, 1].forEach(function (s) {   // 兩端摺起的尾巴
      var ex = s * (w / 2 - 6);
      ctx.fillStyle = '#8e1622'; ctx.beginPath(); ctx.moveTo(ex, -h / 2 + 18); ctx.lineTo(ex + s * 70, -h / 2 + 18); ctx.lineTo(ex + s * 46, 18); ctx.lineTo(ex + s * 70, h / 2 + 18); ctx.lineTo(ex, h / 2 + 18); ctx.closePath(); ctx.fill();
    });
    var g = ctx.createLinearGradient(0, -h / 2, 0, h / 2); g.addColorStop(0, '#e2394a'); g.addColorStop(1, '#a51d2b');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-w / 2, -h / 2); ctx.quadraticCurveTo(0, -h / 2 - 16, w / 2, -h / 2); ctx.lineTo(w / 2, h / 2); ctx.quadraticCurveTo(0, h / 2 - 16, -w / 2, h / 2); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#ffd84a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-w / 2 + 6, -h / 2 + 8); ctx.quadraticCurveTo(0, -h / 2 - 8, w / 2 - 6, -h / 2 + 8); ctx.moveTo(-w / 2 + 6, h / 2 - 8); ctx.quadraticCurveTo(0, h / 2 - 24, w / 2 - 6, h / 2 - 8); ctx.stroke();
    ctx.beginPath(); ctx.rect(-w / 2, -h, w, h * 2); ctx.clip();
    ctx.font = '900 54px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 7; ctx.strokeStyle = '#4a0810'; ctx.strokeText('恭喜過關', 0, -6); ctx.fillStyle = '#fff3c4'; ctx.fillText('恭喜過關', 0, -6);
    ctx.restore();
  }
  function streamers(et, ox, dir, seed) {
    if (et <= 0) return;
    for (var i = 0; i < 7; i++) {
      var a = -Math.PI / 2 + dir * (0.35 + rnd(i, seed) * 0.5), sp = 700 + rnd(i, seed + 1) * 300;
      var hx = ox + Math.cos(a) * sp * (1 - Math.exp(-2.5 * et)) / 2.5, hy = 720 + Math.sin(a) * sp * (1 - Math.exp(-2.5 * et)) / 2.5 + 70 * et * et;
      ctx.save(); ctx.strokeStyle = COL[(i + seed) % 6]; ctx.lineWidth = 5; ctx.globalAlpha = c01((5 - et) / 1.5); ctx.beginPath();
      for (var k = 0; k <= 24; k++) { var f = k / 24, x = ox + (hx - ox) * f + Math.sin(f * 14 + et * 6 + i) * 18 * f, y = 720 + (hy - 720) * f + Math.cos(f * 10 + i) * 10; if (k) ctx.lineTo(x, y); else ctx.moveTo(x, y); }
      ctx.stroke(); ctx.restore();
    }
  }
  function dancers(et) {
    var sp = ['monkey', 'beetle', 'parrot', 'hedgehog', 'lily', 'penguin', 'tanuki', 'monkey'];
    for (var i = 0; i < 8; i++) {
      var left = i % 2 === 0, row = Math.floor(i / 2), t0 = 0.6 + i * 0.12, lt = et - t0;
      if (lt <= 0) continue;
      var tx = left ? 60 + (row % 2) * 60 : 1220 - (row % 2) * 60, ty = 220 + row * 130;
      var inP = out3(lt / 0.5), x = left ? -60 + (tx + 60) * inP : 1340 + (tx - 1340) * inP;
      var hop = Math.abs(Math.sin((lt + i * 0.2) * 5.5)) * 26 * c01((lt - 0.4) / 0.2);
      var sq = 1 + 0.08 * Math.cos((lt + i * 0.2) * 11);
      ctx.save(); ctx.translate(x, ty - hop); ctx.scale(left ? 1 : -1, 1); ctx.scale(sq, 2 - sq);
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(0, 40 + hop, 28 - hop * 0.3, 7, 0, 0, 6.283); ctx.fill();
      Art._sp(ctx, sp[i], 30); ctx.restore();
      if (lt > 0.6 && Math.sin((lt + i) * 2.2) > 0.6) { ctx.save(); ctx.font = 'bold 26px ' + FONT; ctx.fillStyle = COL[i % 6]; ctx.textAlign = 'center'; ctx.fillText(i % 3 ? '♪' : '!', x + (left ? 30 : -30), ty - 50 - hop); ctx.restore(); }
    }
  }
  var D = {
    name: 'D 怪物大遊行',
    steps: ['按 Z 後通關面板從下方滑上來', '畫面左下、右下兩門彩帶砲同時開火, 噴出彩帶與紙花', '紅色緞帶橫幅從中間往兩邊展開, 上面寫「恭喜過關」', '這局收服的怪物從兩側跑進畫面邊緣, 一隻隻跳舞歡呼', '1.6 秒後彩帶砲再補一輪, 怪物持續跳到玩家按 Z'],
    draw: function (et) {
      resultPanel(et, {
        enter: function (c) { var p = out3(et / 0.45); c.globalAlpha = c01(et / 0.25); c.translate(0, (1 - p) * 160); },
        header: function (c, T, P) { subtitle(c, T, P, c01((et - 1.0) / 0.3)); }
      });
      var rw = 560 * out3((et - 0.35) / 0.5); ribbon(640, 124, rw, et);
      dancers(et);
      streamers(et - 0.3, 40, 1, 3); streamers(et - 0.3, 1240, -1, 5);
      confetti(ctx, et - 0.3, 70, 41, 40, 720, -1.05, 0.5, 700, 1100, 6.5); confetti(ctx, et - 0.3, 70, 43, 1240, 720, -2.09, 0.5, 700, 1100, 6.5);
      confetti(ctx, et - 1.9, 50, 47, 40, 720, -1.0, 0.5, 650, 1000, 5); confetti(ctx, et - 1.9, 50, 53, 1240, 720, -2.14, 0.5, 650, 1000, 5);
    }
  };

  var OPTS = { A: A, B: B, C: C, D: D };
  function caption(et) {
    if (et < 0) return t > PRE - 0.7 ? '玩家按 Z' : '第 4 天表演結算(跟現在一樣)';
    if (et < 2) return '通關演出開始';
    if (et < 6) return '慶祝效果進行中';
    return '演出結束, 停在通關畫面等玩家按 Z';
  }
  function setOpt(k) {
    cur = k; t = 0;
    document.querySelectorAll('.opt').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.k === k ? 'true' : 'false'); });
    document.getElementById('d-title').textContent = OPTS[k].name;
    document.getElementById('d-steps').innerHTML = OPTS[k].steps.map(function (s) { return '<li>' + s + '</li>'; }).join('');
  }
  function frame(nw) {
    var dt = Math.min(0.05, (nw - last) / 1000); last = nw;
    if (!paused) { t += dt * speed; if (t > DUR) t = 0; }
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.clearRect(0, 0, 1280, 720);
    try { if (t < PRE) showPhase(t); else OPTS[cur].draw(t - PRE); } catch (e) { console.error(e); }
    document.getElementById('cap').textContent = caption(t - PRE);
    document.getElementById('tl').style.width = (t / DUR * 100) + '%';

  }
  document.querySelectorAll('.opt').forEach(function (b) { b.addEventListener('click', function () { setOpt(b.dataset.k); }); });
  var pb = document.getElementById('btn-pause');
  pb.addEventListener('click', function () { paused = !paused; pb.textContent = paused ? '播放' : '暫停'; });
  document.getElementById('btn-replay').addEventListener('click', function () { t = 0; });
  var sb = document.getElementById('btn-slow');
  sb.addEventListener('click', function () { speed = speed === 1 ? 0.5 : 1; sb.textContent = speed === 1 ? '慢速 0.5×' : '正常速度'; });
  setOpt('A');
  if (reduce) { paused = true; t = PRE + 2.5; pb.textContent = '播放'; }
  if (window.__snap) { setOpt(window.__snap[0]); t = window.__snap[1]; paused = true; }
  requestAnimationFrame(frame);
})();
