<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>icon-a 火柴猴海報</title>
<style>html,body{margin:0;overflow:hidden;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="512" height="512"></canvas>
<script src="../game/art/art.js"></script>
<script>
// 圖示 A: 馬戲團海報 — 奶油底 + 紅色放射光芒, 正中央一隻放大的生氣火柴猴(頭頂冒火), 不放任何字
(function () {
  var cv = document.getElementById('c'), ctx = cv.getContext('2d'), A = window.Art;
  var W = 512, H = 512, CX = 256, CY = 268;

  // 底: 奶油色(遊戲裡帳篷海報的底色)
  ctx.fillStyle = '#f4ecdc'; ctx.fillRect(0, 0, W, H);
  // 放射光芒(遊戲海報立牌同款的紅色扇形), 鋪滿到四角
  ctx.save();
  for (var r = 0; r < 18; r++) {
    var a0 = r * Math.PI * 2 / 18 - 0.05;
    ctx.beginPath(); ctx.moveTo(CX, CY); ctx.arc(CX, CY, 520, a0, a0 + Math.PI / 18); ctx.closePath();
    ctx.fillStyle = 'rgba(224,90,74,0.30)'; ctx.fill();
  }
  ctx.restore();
  // 中央暖光 + 外圈壓暗, 把視線收到主角
  var rg = ctx.createRadialGradient(CX, CY, 60, CX, CY, 360);
  rg.addColorStop(0, 'rgba(255,246,214,0.85)'); rg.addColorStop(0.55, 'rgba(255,246,214,0)'); rg.addColorStop(1, 'rgba(90,30,30,0.28)');
  ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);

  // 舞台小圓台(主角腳下)
  ctx.beginPath(); ctx.ellipse(CX, 430, 150, 26, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#e05a4a'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = '#0d1018'; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(CX, 426, 118, 16, 0, 0, Math.PI * 2);
  ctx.strokeStyle = '#ffc83a'; ctx.lineWidth = 5; ctx.stroke();

  // 兩顆金星(左上、右上, 在中央 80% 內)
  function star(x, y, R) {
    ctx.beginPath();
    for (var i = 0; i < 10; i++) { var a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? R * 0.45 : R; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    ctx.closePath(); ctx.fillStyle = '#ffc83a'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = '#0d1018'; ctx.stroke();
  }
  star(100, 110, 26); star(414, 104, 22);

  // 主角: 表演場的火柴猴, 怒氣破表(生氣眼 + 一縷蒸氣)且剛被點燃(頭頂火舌)。剪掉頭上的怒氣條
  ctx.save();
  ctx.translate(CX, CY + 14); ctx.scale(5.6, 5.6);
  ctx.beginPath(); ctx.rect(-70, -37, 140, 110); ctx.clip();
  A.drawShowMonster(ctx, { x: 0, y: 0, species: 'monkey', rage: 92, angryLow: 80, marks: 1, mode: 'roam', dir: 1,
    fx: 'ignited', fxT: 0.22, fxDur: 0.5, move: 'walk' });
  ctx.restore();
})();
</script>
</body>
</html>
