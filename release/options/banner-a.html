<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>banner-a 謝幕排排站</title>
<style>html,body{margin:0;overflow:hidden;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1680" height="720"></canvas>
<script src="../game/art/art.js"></script>
<script>
// 橫幅 A: 紅布幕舞台的謝幕 — 7 種魔物前後兩排排排站, 馴獸師站正中間; 上方大字遊戲名
// 左下角(x < 504、y > 540)只有舞台地板與左側布幕
(function () {
  var cv = document.getElementById('c'), ctx = cv.getContext('2d'), A = window.Art;
  var W = 1680, H = 720;
  var FONT = '"Microsoft JhengHei","PingFang TC","Noto Sans TC","Heiti TC",sans-serif';
  // 遊戲收場布幕的配色
  var CUR_A = '#c82a38', CUR_B = '#8e1622', DRAPE = '#7a1019', FRINGE = '#e8b33a';

  function star(x, y, R, fill, line) {
    ctx.beginPath();
    for (var i = 0; i < 10; i++) { var a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? R * 0.45 : R; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
    if (line) { ctx.lineWidth = 3; ctx.strokeStyle = line; ctx.stroke(); }
  }
  function monster(sp, x, y, k, extra) {
    var s = { x: 0, y: 0, species: sp, rage: 20, angryLow: 80, mode: 'roam', dir: 1, move: 'walk' };
    for (var key in extra) s[key] = extra[key];
    ctx.save(); ctx.translate(x, y); ctx.scale(k, k);
    ctx.beginPath(); ctx.rect(-70, -37, 140, 110); ctx.clip();   // 剪掉頭上的怒氣條
    A.drawShowMonster(ctx, s);
    ctx.restore();
  }
  function title(str, x, y, size, maxW) {
    ctx.save();
    ctx.font = '900 ' + size + 'px ' + FONT;
    var w = ctx.measureText(str).width;
    if (w > maxW) { size = Math.floor(size * maxW / w); ctx.font = '900 ' + size + 'px ' + FONT; }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    ctx.shadowColor = 'rgba(255,200,90,0.55)'; ctx.shadowBlur = 26;
    ctx.lineWidth = size * 0.2; ctx.strokeStyle = '#3a1a10'; ctx.strokeText(str, x, y);
    ctx.shadowBlur = 0;
    var g = ctx.createLinearGradient(0, y - size / 2, 0, y + size / 2);
    g.addColorStop(0, '#fff3b8'); g.addColorStop(0.55, '#ffe08a'); g.addColorStop(1, '#ffc83a');
    ctx.fillStyle = g; ctx.fillText(str, x, y);
    ctx.restore();
  }

  // 後牆(夜色舞台, 同標題畫面的漸層)
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1c1630'); g.addColorStop(0.6, '#241a2e'); g.addColorStop(1, '#120e18');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 兩道聚光燈打在隊伍上
  for (var k = 0; k < 2; k++) {
    var ox = k === 0 ? 420 : 1260;
    ctx.save(); ctx.translate(ox, -30); ctx.rotate(k === 0 ? -0.42 : 0.42);
    ctx.beginPath(); ctx.moveTo(-26, 0); ctx.lineTo(26, 0); ctx.lineTo(260, 640); ctx.lineTo(-260, 640); ctx.closePath();
    ctx.fillStyle = 'rgba(255,240,200,0.07)'; ctx.fill(); ctx.restore();
  }
  // 後牆上的小燈
  for (var b = 0; b < 22; b++) {
    var bx = 210 + b * 60, by = 248 + Math.sin(b * 0.9) * 6;
    ctx.beginPath(); ctx.arc(bx, by, 4.5, 0, Math.PI * 2);
    ctx.fillStyle = ['rgba(255,214,120,0.5)', 'rgba(255,143,200,0.45)', 'rgba(140,210,255,0.45)'][b % 3]; ctx.fill();
  }
  // 舞台地板(大橢圓)+ 腳下的光池
  ctx.beginPath(); ctx.ellipse(840, 650, 1000, 230, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#2b2a35'; ctx.fill(); ctx.strokeStyle = '#4a4458'; ctx.lineWidth = 4; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(840, 650, 620, 140, 0, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 3; ctx.stroke();
  var pool = ctx.createRadialGradient(840, 500, 30, 840, 500, 560);
  pool.addColorStop(0, 'rgba(255,236,180,0.22)'); pool.addColorStop(1, 'rgba(255,236,180,0)');
  ctx.save(); ctx.translate(840, 500); ctx.scale(1, 0.32); ctx.translate(-840, -500);
  ctx.fillStyle = pool; ctx.beginPath(); ctx.arc(840, 500, 560, 0, Math.PI * 2); ctx.fill(); ctx.restore();

  // 後排(較小): 齒輪甲蟲、標靶鸚鵡、爆竹刺蝟、鈴蘭精
  var back = [['beetle', 520], ['parrot', 715], ['hedgehog', 965], ['lily', 1160]];
  for (var i = 0; i < back.length; i++) monster(back[i][0], back[i][1], 372, 2.35, { dir: back[i][1] < 840 ? 1 : -1 });
  // 前排: 火柴猴、(馴獸師)、冰柱企鵝、戲法狸
  monster('monkey', 620, 470, 2.75, { dir: 1 });
  monster('penguin', 1060, 470, 2.75, { dir: -1 });
  monster('tanuki', 1290, 470, 2.6, { dir: -1 });
  // 馴獸師: 正中央、面向觀眾、拿劍
  ctx.save(); ctx.translate(840, 476); ctx.scale(3, 3);
  A.drawTamer(ctx, { x: 0, y: 0, facing: 4, weapon: 'sword' });
  ctx.restore();

  // 左右布幕(收起的兩片, 皺褶 + 流蘇)
  function curtain(side) {
    var outer = side < 0 ? 0 : W, inner = outer - side * 175;
    ctx.save();
    ctx.beginPath(); ctx.moveTo(outer, 0); ctx.lineTo(inner + side * 30, 0);
    ctx.bezierCurveTo(inner - side * 10, 260, inner + side * 70, 420, inner - side * 5, 720);
    ctx.lineTo(outer, 720); ctx.closePath();
    ctx.fillStyle = CUR_B; ctx.fill();
    ctx.clip();
    for (var p = 0; p < 9; p++) {
      var x0 = side < 0 ? p * 24 : W - (p + 1) * 24;
      var gr = ctx.createLinearGradient(x0, 0, x0 + 24, 0);
      gr.addColorStop(0, 'rgba(40,0,6,0.55)'); gr.addColorStop(0.5, p % 2 ? CUR_A : CUR_B); gr.addColorStop(1, 'rgba(40,0,6,0.55)');
      ctx.fillStyle = p % 2 ? CUR_A : CUR_B; ctx.fillRect(x0, 0, 25, 720);
      ctx.fillStyle = gr; ctx.fillRect(x0, 0, 25, 720);
    }
    // 綁帶(金)
    ctx.fillStyle = FRINGE; ctx.fillRect(side < 0 ? 0 : W - 230, 440, 230, 12);
    ctx.restore();
  }
  curtain(-1); curtain(1);
  // 頂上垂褶(半圓一排 + 金邊)
  ctx.fillStyle = DRAPE; ctx.fillRect(0, 0, W, 46);
  for (var v = 0; v < Math.ceil(W / 64); v++) {
    var cx = 32 + v * 64;
    ctx.beginPath(); ctx.arc(cx, 46, 32, 0, Math.PI); ctx.closePath(); ctx.fillStyle = DRAPE; ctx.fill();
    ctx.beginPath(); ctx.arc(cx, 46, 30.5, 0.08, Math.PI - 0.08); ctx.strokeStyle = FRINGE; ctx.lineWidth = 3; ctx.stroke();
  }
  ctx.fillStyle = FRINGE; ctx.fillRect(0, 44, W, 6);

  // 遊戲名(兩側各一顆金星)
  title('來馬戲團看一點大場面', 840, 168, 112, 1180);
  star(222, 168, 30, '#ffd24a', '#3a1a10');
  star(1458, 168, 30, '#ffd24a', '#3a1a10');
})();
</script>
</body>
</html>
