<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>icon-b 炸藥桶與企鵝</title>
<style>html,body{margin:0;overflow:hidden;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="512" height="512"></canvas>
<script src="../game/art/art.js"></script>
<script>
// 圖示 B: 表演場俯視 — 炸藥桶正在爆(橘黃火光圈鋪滿畫面中央), 冰柱企鵝被炸得頭暈眼花轉星星, 不放任何字
(function () {
  var cv = document.getElementById('c'), ctx = cv.getContext('2d'), A = window.Art;
  var W = 512, H = 512, CX = 256, CY = 262;

  // 底: 表演場地板(遊戲內場地色)+ 場地圓圈線
  ctx.fillStyle = '#23222c'; ctx.fillRect(0, 0, W, H);
  var fg = ctx.createRadialGradient(CX, CY, 40, CX, CY, 380);
  fg.addColorStop(0, '#3a3746'); fg.addColorStop(1, '#16151d');
  ctx.fillStyle = fg; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.ellipse(CX, CY, 300, 300, 0, 0, Math.PI * 2); ctx.stroke();

  // 炸藥桶爆炸(遊戲內畫法放大): 範圍圈半徑 110 × 2.05 ≈ 225
  ctx.save();
  ctx.translate(CX, CY); ctx.scale(2.05, 2.05);
  A.drawShowKeg(ctx, { x: 0, y: 0, phase: 'blast', t: 0.05, dur: 0.3, radius: 110 });
  ctx.restore();

  // 四周飛出去的彩紙(遊戲彩炮配色), 只在中央 80% 內
  var CONF = ['#ff5d7a', '#ffd24a', '#c6f046', '#5ad1e6', '#ff8fc8', '#b46cff'];
  var bits = [[96, 120, 0.6], [418, 140, -0.5], [80, 330, -0.3], [440, 360, 0.8], [150, 448, 0.3], [372, 456, -0.7], [256, 70, 0.1]];
  for (var i = 0; i < bits.length; i++) {
    ctx.save(); ctx.translate(bits[i][0], bits[i][1]); ctx.rotate(bits[i][2]);
    ctx.fillStyle = CONF[i % CONF.length]; ctx.fillRect(-13, -7, 26, 14);
    ctx.lineWidth = 3; ctx.strokeStyle = '#0d1018'; ctx.strokeRect(-13, -7, 26, 14);
    ctx.restore();
  }

  // 主角: 冰柱企鵝被撞歪(暈眼 + 頭上轉星星)。剪掉頭上的怒氣條
  ctx.save();
  ctx.translate(CX, CY + 8); ctx.scale(6.4, 6.4);
  ctx.beginPath(); ctx.rect(-70, -37, 140, 110); ctx.clip();
  A.drawShowMonster(ctx, { x: 0, y: 0, species: 'penguin', rage: 30, angryLow: 80, marks: 0, mode: 'knock', knockT: 0.07, knockDur: 0.25, dir: 1, move: 'walk' });
  ctx.restore();
})();
</script>
</body>
</html>
